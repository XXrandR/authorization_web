name: CI

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: "Project Key"
        required: true
        default: "XXrandR_authorization_web"
      organization:
        description: "Organization Key"
        required: true
        default: "xxrandr"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare (Build, Lint & Artifacts)
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.timestamp.outputs.ts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate build timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Secrets Scan (Gitleaks)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Historia completa: gitleaks detect escanea todos los commits
          fetch-depth: 0

      - name: Gitleaks
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-gitleaks@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          fail-on-error: "true"

  trivy:
    name: Dependency & Security Scan (Trivy)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Trivy FS Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-trivy@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          fail-on-error: "true"

  sonarcloud:
    name: Code Quality & SAST (SonarCloud)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: DevSecOps-Engineer-Org/reusable-workflows/actions/qa-sonar@0cf27106d2ac24cb8b031e942e3a3bab3a5c10f6 # v1.0.2
        with:
          app-name: authorization-web
          project-key: ${{ github.event.inputs.project_key }}
          organization: ${{ github.event.inputs.organization }}
          tek: nextjs
          build-timestamp: ${{ needs.prepare.outputs.ts }}
          sonar-url: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  cleanup:
    name: Cleanup QA Artifacts
    needs: [prepare, gitleaks, trivy, sonarcloud]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="qa-artifacts-${RUN_ID}"
          IDS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .id" || true)
          if [ -z "$IDS" ]; then
            echo "No hay artefactos temporales pendientes por limpiar."
          else
            for id in $IDS; do
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
              echo "Artefacto temporal eliminado: ${ARTIFACT_NAME} (id=${id})"
            done
          fi
