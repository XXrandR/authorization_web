name: SonarQube Manual Analysis

on:
  workflow_dispatch:

jobs:
  sonarqube:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Wait and Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Print Quality Gate & Coverage Results
        if: always()  # Se ejecuta aunque falle el Quality Gate (para ver el reporte)
        run: |
          echo "=== SonarQube Project Status ==="
          curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=authorization_web" \
            | jq -r '.projectStatus | "Status: " + .status, (.conditions[] | "- " + .metricKey + ": " + (.actualValue|tostring) + " (threshold " + (.errorThreshold|tostring) + ") -> " + .status)'
          echo ""
          echo "=== Key Metrics ==="
          curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
            "$SONAR_HOST_URL/api/measures/component?component=authorization_web&metricKeys=coverage,lines,statements,branches,code_smells,bugs,vulnerabilities,reliability_rating,security_rating,sqale_rating" \
            | jq -r '.component.measures[] | "- " + .metric + ": " + .value'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
