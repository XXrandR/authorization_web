name: SonarQube Manual Analysis

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'Clave del proyecto en SonarCloud (projectKey)'
        required: true
        default: 'authorization_web'
        type: string
      organization:
        description: 'Nombre de la organización en SonarCloud'
        required: true
        default: 'tu-organizacion'
        type: string

jobs:
  sonarqube:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.inputs.project_key }}
            -Dsonar.organization=${{ github.event.inputs.organization }}
  
      - name: Wait and Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Print Quality Gate & Coverage Results
        if: always()  # Se ejecuta aunque falle el Quality Gate para que puedas ver el resumen
        run: |
          echo "=== SonarCloud Project Status ==="
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=authorization_web" \
            | jq -r '.projectStatus | "Status: " + .status, (.conditions[]? | "- " + .metricKey + ": " + (.actualValue|tostring) + " (threshold " + (.errorThreshold|tostring) + ") -> " + .status)'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
