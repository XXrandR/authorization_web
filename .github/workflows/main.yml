name: SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: 'Project Key'
        required: true
        default: 'XXrandR_authorization_web'
      organization:
        description: 'Organization Key'
        required: true
        default: 'xxrandr'

jobs:
  sonarcloud:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.inputs.project_key }}
            -Dsonar.organization=${{ github.event.inputs.organization }}

      - name: Wait and Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Print Quality Gate & Coverage Results
        if: always()
        run: |
          echo "=== SonarCloud Project Status ==="
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ github.event.inputs.project_key }}" \
            | jq -r '.projectStatus | "Status: " + .status, (.conditions[]? | "- " + .metricKey + ": " + .actualValue|tostring) + " (threshold " + (.errorThreshold|tostring) + ") -> " + .status'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
